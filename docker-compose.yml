services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doctask
    ports:
      # 5432 and 5433 are commonly already taken on a dev box, so this project
      # claims 5434 on the host. Inside the compose network it is still 5432.
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doctask"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/doctask
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WATCH_DIR: /app/corpora/inbox
    ports:
      # 8000 is the default for half the Python web world, so this project
      # claims 8010 on the host. Override with API_PORT if that clashes too.
      - "${API_PORT:-8010}:8000"
    volumes:
      - ./corpora:/app/corpora
    # Migrate, seed the demo pile, then serve. One command, fresh clone to
    # working system -- graded behaviour 6.
    command: >
      sh -c "python -m app.store.migrate &&
             python -m app.seed &&
             uvicorn app.api.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
