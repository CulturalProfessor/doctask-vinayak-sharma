services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doctask
    ports:
      # 5432 and 5433 are commonly already taken on a dev box, so this project
      # claims 5434 on the host. Inside the compose network it is still 5432.
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doctask"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    # Documents uploaded through the UI are written into the bind-mounted
    # corpora/ below, and the container writes them as root, so on the host they
    # end up owned by root and need sudo to delete. Setting DOCTASK_UID and
    # DOCTASK_GID to your own ids fixes that:
    #
    #     DOCTASK_UID=$(id -u) DOCTASK_GID=$(id -g) docker compose up
    #
    # It is opt-in and defaults to the current behaviour on purpose. Guessing an
    # id wrong makes corpora/ unwritable and breaks uploads and the watched
    # folder outright, which is a much worse failure than a file that is
    # awkward to delete -- and "a stranger can run it with one command" is not
    # something to trade away for tidier file ownership.
    user: "${DOCTASK_UID:-0}:${DOCTASK_GID:-0}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/doctask
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The watched location. On here and off by default elsewhere: a
      # background loop that dispatches runs is a surprise in a test process
      # and the feature in a running deployment. Drop a file into
      # corpora/inbox/ on the host and it lands in the `acme` pile as a
      # targeted update, halted at the gate like every other arrival.
      WATCH_ENABLED: ${WATCH_ENABLED:-true}
      WATCH_DIR: /app/corpora/inbox
      WATCH_PILE: ${WATCH_PILE:-acme}
      WATCH_INTERVAL_SECONDS: ${WATCH_INTERVAL_SECONDS:-3}
    ports:
      # 8000 is the default for half the Python web world, so this project
      # claims 8010 on the host. Override with API_PORT if that clashes too.
      - "${API_PORT:-8010}:8000"
    volumes:
      - ./corpora:/app/corpora
    # Migrate, seed the demo pile, then serve. One command, fresh clone to
    # working system -- graded behaviour 6.
    command: >
      sh -c "python -m app.store.migrate &&
             python -m app.seed &&
             uvicorn app.api.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
