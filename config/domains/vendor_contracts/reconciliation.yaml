# How facts are grouped, and what counts as a disagreement.

# Facts sharing (entity_key, field) form one group. A group with more than one
# distinct normalised value is a conflict.
group_by: [entity_key, field]

# Later types supersede earlier ones. This ranking produces a *proposed*
# resolution attached to the conflict -- it is never applied on its own. The
# conflict still goes to the human gate. See PLAN.md section 2.
#
# Ordered by contractual authority, not by recency. An amendment supersedes the
# agreement it amends, and the agreement supersedes a statement of work issued
# under it. An invoice ranks lowest on purpose: it is evidence of what was
# billed, never authority on what the rate should have been. Ranking invoices
# highest would propose the billing error as the correct answer.
precedence: [invoice, notice, sow, msa, amendment]

# Values within tolerance of each other are the same value, not a conflict.
# Without this, a rounded total on an invoice reads as a disagreement.
tolerance:
  money:
    relative: 0.005
  number:
    relative: 0.001
  duration_days:
    absolute: 0

# Fields that describe the document instance rather than the engagement.
#
# Three invoices legitimately carry three different invoice numbers, dates,
# hours and amounts. Comparing those across documents produces noise, not
# disagreement -- and six spurious conflicts alongside three real ones is worse
# than no conflict detection at all, because a reviewer stops reading.
#
# Fields NOT listed here are contractual terms. Two documents stating different
# values for one of those IS the disagreement worth surfacing -- which is why
# hourly_rate and payment_terms_days are deliberately absent, even though
# invoices restate both.
instance_fields:
  - invoice_number
  - invoice_date
  - service_period
  - hours_billed
  - amount_due
  - sow_number
  - amendment_number
  - start_date
  - end_date
  - effective_date
  - notice_type
  - notice_date
  - notice_period_days
  - total_value

# Fields used to establish which engagement a document belongs to.
#
# Excluded from conflict detection because entity resolution has already settled
# the question they would raise. Amendment 2 names both parties and the MSA
# names one; resolution attached them to the same engagement, so also reporting
# "the documents disagree about the counterparty" is a second bite at a decision
# already made, and it is noise in front of the reviewer.
identity_fields:
  - counterparty

# Fields where documents are *expected* to differ over time. A rate that
# changed in an amendment is history, not a contradiction -- unless a document
# dated after the change still uses the old value, which is the case worth
# raising.
time_varying_fields:
  - hourly_rate
  - payment_terms_days
  - termination_notice_days
  - liability_cap
  - term_months

# Above this many open conflicts, the run escalates as a whole rather than
# flooding the gate with individual items.
escalate_above: 25

# Which engagement a document belongs to.
#
# The model names a party; it does not get to decide identity. A real run had
# amendment 1 answer "Acme Fabrication Services LLC" and amendment 2 answer
# "Brightwell Manufacturing Inc. and Acme Fabrication Services LLC" for the same
# field in near-identical documents. Both are defensible readings, and they slug
# to different keys -- which would have split the pile in two and hidden every
# conflict between them.
entity:
  # Legal forms and connectives that vary between documents describing the same
  # party. Dropped before comparing names.
  stopwords:
    [inc, incorporated, llc, llp, ltd, limited, corp, corporation, co, company,
     plc, gmbh, pty, and, the]

  # Explicit human decisions, which outrank any inference below them. Add a
  # spelling here when resolution guesses wrong rather than editing code.
  aliases: {}
    # acme-fabrication-services-llc:
    #   - "Acme Fabrication"
    #   - "Acme Fab Services"

  # How alike two counterparty names have to read before a person is asked
  # whether they are the same party.
  #
  # The exact rules above catch a name that changed its *shape* -- extra
  # parties, a different legal form. They do not catch a name that changed its
  # *spelling*: "Acme Fabrication Svcs" shares no whole token with
  # "Acme Fabrication Services LLC" beyond the first two, so containment fails
  # and the pile would quietly acquire a second engagement holding half the
  # documents. Every disagreement between the two halves then stops being found,
  # and the register looks clean because it is only ever comparing a document
  # with itself.
  #
  # Above this similarity the document is ESCALATED, never merged. A score is
  # evidence that a question exists; it is not an answer, and an automatic merge
  # would corrupt the register in the way that is hardest to spot afterwards.
  #
  # Raise it for a pile of related subsidiaries whose names legitimately look
  # alike; lower it for a pile of unrelated vendors where a false escalation
  # costs less than a missed one. Set it to 1.1 to switch the step off, which is
  # a defensible choice for a pile with one counterparty and an honest one to
  # make explicitly rather than by deleting the feature.
  near_match_similarity: 0.55

# The field that says when a document's terms take effect. Used only to break a
# tie between documents of equal authority -- two amendments both outrank the
# agreement they amend, so type alone cannot say which governs, but the later
# one supersedes the earlier and the documents say so themselves.
effective_date_field: effective_date
